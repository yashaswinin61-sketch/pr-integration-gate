---
# PR integration gate
#
#   fast-checks ──► build-service ──► integration (dynamic matrix, 1 job per test)
#        │                                   │
#        └──────────────► report ◄───────────┘   (step summary + sticky PR comment)
#                           gate                 (the ONE required status check)
#
# Make only `gate` a required check in the branch ruleset. It always runs
# (unless the run is cancelled) and fails unless every other job succeeded,
# because GitHub treats a *skipped* required check as passing.
name: pr-gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

# One run per PR: a new push cancels the outdated run instead of queueing behind it.
concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MATRIX: .github/integration-tests.json
  # Fork PRs never get here: their code would run with our runner and secrets.
  SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  fast-checks:
    name: fast-checks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint workflows
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.4/scripts/download-actionlint.bash) 1.7.4
          ./actionlint -color
      - name: Lint Python
        run: pip install ruff && ruff check . && ruff format --check .
      - name: Validate test matrix
        run: python scripts/gate.py validate "$MATRIX"
      - name: Unit tests (gate + service)
        run: python -m unittest discover -s tests -v
      - name: Plan matrix
        id: plan
        run: echo "matrix=$(python scripts/gate.py matrix "$MATRIX")" >> "$GITHUB_OUTPUT"

  build-service:
    name: build-service
    needs: fast-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Build the service from THIS PR's code once, and share it with every test job.
      - name: Build image
        run: docker build -t "mock-build-service:${{ github.sha }}" service/
      - name: Save image
        run: docker save "mock-build-service:${{ github.sha }}" | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: service-image
          path: image.tar.gz
          retention-days: 1

  integration:
    name: integration (${{ matrix.id }})
    needs: [fast-checks, build-service]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false # one red test must not hide the others
      max-parallel: 6
      matrix: ${{ fromJSON(needs.fast-checks.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Start isolated service instance
        id: svc
        uses: ./.github/actions/start-service
        with:
          image-artifact: service-image
          instance: gate-${{ matrix.id }}-${{ github.run_id }}

      - name: Run ${{ matrix.id }}
        env:
          GATE_API: ${{ steps.svc.outputs.api }}
        run: python scripts/gate.py run "$MATRIX" "${{ matrix.id }}" --out results

      - name: Service logs
        if: always()
        run: docker compose -f service/compose.yml -p "gate-${{ matrix.id }}-${{ github.run_id }}" logs --no-color > results/service.log 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.id }}
          path: results/
          retention-days: 14

      - name: Tear down
        if: always()
        run: |
          docker compose -f service/compose.yml -p "gate-${{ matrix.id }}-${{ github.run_id }}" down -v || true
          rm -f "$RUNNER_TEMP/gate.env"

  report:
    name: report
    needs: [fast-checks, integration]
    # !cancelled(), not always(): a cancelled run must release the concurrency group fast.
    if: ${{ !cancelled() && needs.fast-checks.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results
      - name: Summary
        run: |
          python scripts/gate.py summary results --matrix "$MATRIX" > summary.md
          {
            cat summary.md
            echo
            echo "[Run ${{ github.run_id }} (attempt ${{ github.run_attempt }})](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } | tee -a "$GITHUB_STEP_SUMMARY" > comment.md
      - name: Sticky PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pr-integration-gate -->';
            const body = marker + '\n' + fs.readFileSync('comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  gate:
    name: gate
    needs: [fast-checks, build-service, integration]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Same-repository PR
        if: env.SAME_REPO != 'true'
        run: |
          echo "::error::PRs from forks are not run on this gate. Push the branch to this repository."
          exit 1
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          bad = {k: v["result"] for k, v in needs.items() if v["result"] != "success"}
          for job, result in bad.items():
              print(f"::error::{job} = {result}")
          sys.exit(1 if bad else 0)'
